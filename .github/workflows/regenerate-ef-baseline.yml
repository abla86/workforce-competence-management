name: Regenerate EF baseline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, 'regenerate EF baseline') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore backend
        run: dotnet restore backend/Workforce.Api/Workforce.Api.csproj
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.11
      - name: Confirm model is buildable
        run: dotnet build backend/Workforce.Api/Workforce.Api.csproj -c Release --no-restore
      - name: Regenerate checked-in EF baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f backend/Workforce.Api/Migrations/*.cs
          dotnet ef migrations add InitialCreate \
            --project backend/Workforce.Api/Workforce.Api.csproj \
            --startup-project backend/Workforce.Api/Workforce.Api.csproj \
            --context Workforce.Api.Data.AppDbContext \
            --configuration Release
      - name: Verify no pending model changes
        run: dotnet ef migrations has-pending-model-changes --project backend/Workforce.Api/Workforce.Api.csproj --startup-project backend/Workforce.Api/Workforce.Api.csproj --context Workforce.Api.Data.AppDbContext --configuration Release
      - name: Commit regenerated baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Workforce.Api/Migrations/
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "fix: regenerate EF baseline from current model"
          git push origin HEAD:main
