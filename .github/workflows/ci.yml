name: Full Stack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_PASSWORD: "CiOnly-Password-2026!"
  JWT_SECRET_KEY: "CiOnly-Jwt-Key-2026-At-Least-32-Bytes-Long"
  VAKTKLAR_BOOTSTRAP_KEY: "ci-bootstrap-key"
  SECURITY_COOKIE_SECURE: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore backend
        run: dotnet restore backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj
      - name: Build backend
        run: dotnet build backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj -c Release --no-restore
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.11
      - name: Validate EF migration set
        run: dotnet ef migrations list --project backend/Workforce.Api/Workforce.Api.csproj --startup-project backend/Workforce.Api/Workforce.Api.csproj --no-build
      - name: Test backend
        run: dotnet test backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Docker Compose stack
        run: docker compose build
      - name: Start full stack
        run: docker compose up -d
      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:5080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color --tail=200 api
          exit 1
      - name: Check frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8088/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs --no-color --tail=100 frontend
          exit 1
      - name: Verify unauthenticated API is protected
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/api/dashboard)" = "401"
      - name: Bootstrap demo administrator
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
            -H 'Content-Type: application/json' \
            -d '{"bootstrapKey":"ci-bootstrap-key","username":"ci-admin","password":"Ci-Password-2026!"}' \
            http://localhost:5080/api/auth/bootstrap
      - name: Authenticate
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
            -c /tmp/vaktklar-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"Ci-Password-2026!"}' \
            http://localhost:5080/api/auth/login
      - name: Smoke test workforce CRUD and planning flow
        shell: bash
        run: |
          set -euo pipefail
          COOKIE=(-b /tmp/vaktklar-cookies.txt -c /tmp/vaktklar-cookies.txt)

          EMPLOYEE_JSON='{"name":"CI Regression Employee","role":"Nurse","positionPercent":100}'
          EMPLOYEE=$(curl --fail -sS "${COOKIE[@]}" -H 'Content-Type: application/json' -d "$EMPLOYEE_JSON" http://localhost:5080/api/employees)
          EMPLOYEE_ID=$(printf '%s' "$EMPLOYEE" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          COMP_JSON='{"name":"CI Regression Competence","category":"Clinical"}'
          COMP=$(curl --fail -sS "${COOKIE[@]}" -H 'Content-Type: application/json' -d "$COMP_JSON" http://localhost:5080/api/competences)
          COMP_ID=$(printf '%s' "$COMP" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          curl --fail -sS "${COOKIE[@]}" -H 'Content-Type: application/json' \
            -d "{\"competenceId\":$COMP_ID,\"level\":\"Advanced\"}" \
            "http://localhost:5080/api/employees/$EMPLOYEE_ID/competences"

          SHIFT_JSON='{"date":"2026-08-21","shiftType":"Day","department":"CI","startTime":"08:00","hours":8,"minimumStaff":1,"isCritical":false}'
          SHIFT=$(curl --fail -sS "${COOKIE[@]}" -H 'Content-Type: application/json' -d "$SHIFT_JSON" http://localhost:5080/api/shifts)
          SHIFT_ID=$(printf '%s' "$SHIFT" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          curl --fail -sS "${COOKIE[@]}" -H 'Content-Type: application/json' \
            -d "{\"competenceId\":$COMP_ID,\"minimumCount\":1,\"minimumLevel\":\"Advanced\",\"requiredRole\":\"Nurse\",\"isCritical\":true}" \
            "http://localhost:5080/api/shifts/$SHIFT_ID/requirements"

          curl --fail -sS "${COOKIE[@]}" -H 'Content-Type: application/json' \
            -d "{\"employeeId\":$EMPLOYEE_ID}" \
            "http://localhost:5080/api/shifts/$SHIFT_ID/assignments"

          curl --fail -sS "${COOKIE[@]}" "http://localhost:5080/api/shifts/$SHIFT_ID/coverage" >/tmp/coverage.json
          python -c 'import json; d=json.load(open("/tmp/coverage.json")); assert "status" in d or "overallStatus" in d, d'

          curl --fail -sS "${COOKIE[@]}" "http://localhost:5080/api/shifts/$SHIFT_ID/candidates" >/tmp/candidates.json
          curl --fail -sS "${COOKIE[@]}" "http://localhost:5080/api/audit?take=10" >/tmp/audit.json

          curl --fail -sS -X POST "${COOKIE[@]}" -H 'Content-Type: application/json' \
            -d "{\"removeEmployeeIds\":[$EMPLOYEE_ID]}" \
            "http://localhost:5080/api/shifts/$SHIFT_ID/coverage/scenario" >/tmp/scenario.json

          echo "Full workforce CRUD/planning smoke test passed: employee=$EMPLOYEE_ID competence=$COMP_ID shift=$SHIFT_ID"
      - name: Verify frontend after authenticated API flow
        run: curl --fail --silent --show-error http://localhost:8088/ >/dev/null
      - name: Show service status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200 api frontend sqlserver
      - name: Stop stack
        if: always()
        run: docker compose down -v
