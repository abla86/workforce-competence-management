name: Full Stack CI

on:
  push:
    branches: [ "main", "feature/vaktklar-production" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore API
        run: dotnet restore backend/Workforce.Api/Workforce.Api.csproj

      - name: Build API
        run: dotnet build backend/Workforce.Api/Workforce.Api.csproj -c Release --no-restore

      - name: Restore tests
        run: dotnet restore backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj

      - name: Build tests
        run: dotnet build backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj -c Release --no-restore

      - name: Test backend
        run: dotnet test backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Compose stack
        run: docker compose build
