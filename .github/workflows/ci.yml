name: Full Stack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI-only values. These are non-production test credentials used solely by the compose smoke test.
  DB_PASSWORD: "CiOnly-Password-2026!"
  JWT_SECRET_KEY: "CiOnly-Jwt-Key-2026-At-Least-32-Bytes-Long"
  VAKTKLAR_BOOTSTRAP_KEY: "ci-bootstrap-key"
  SECURITY_COOKIE_SECURE: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore backend
        run: dotnet restore backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj
      - name: Build backend
        run: dotnet build backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj -c Release --no-restore
      - name: Test backend
        run: dotnet test backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Docker Compose stack
        run: docker compose build
      - name: Start full stack
        run: docker compose up -d
      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:5080/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color --tail=200 api
          exit 1
      - name: Check frontend
        run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8088/
      - name: Bootstrap demo administrator
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
            -H 'Content-Type: application/json' \
            -d '{"bootstrapKey":"ci-bootstrap-key","username":"ci-admin","password":"Ci-Password-2026!"}' \
            http://localhost:5080/api/auth/bootstrap
      - name: Authenticate and smoke test protected API
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
            -c /tmp/vaktklar-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"Ci-Password-2026!"}' \
            http://localhost:5080/api/auth/login
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
            -b /tmp/vaktklar-cookies.txt \
            http://localhost:5080/api/dashboard
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
            -b /tmp/vaktklar-cookies.txt \
            http://localhost:5080/api/shifts
      - name: Show service status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200 api frontend sqlserver
      - name: Stop stack
        if: always()
        run: docker compose down -v
