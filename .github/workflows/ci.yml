name: Full Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECURITY_COOKIE_SECURE: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Generate ephemeral EF credentials
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="Aa1!$(openssl rand -hex 28)"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$DB_PASSWORD"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore backend
        run: dotnet restore backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj
      - name: Build backend
        run: dotnet build backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj -c Release --no-restore
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Validate EF model has no pending migration changes
        run: dotnet ef migrations has-pending-model-changes --project backend/Workforce.Api/Workforce.Api.csproj --startup-project backend/Workforce.Api/Workforce.Api.csproj --context Workforce.Api.Data.AppDbContext --configuration Release
      - name: Validate EF migration set
        run: dotnet ef migrations list --project backend/Workforce.Api/Workforce.Api.csproj --startup-project backend/Workforce.Api/Workforce.Api.csproj --context Workforce.Api.Data.AppDbContext --configuration Release --no-build
      - name: Test backend
        run: dotnet test backend/Workforce.Api.Tests/Workforce.Api.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="Aa1!$(openssl rand -hex 28)"
          JWT_SECRET_KEY="$(openssl rand -hex 32)"
          VAKTKLAR_BOOTSTRAP_KEY="$(openssl rand -hex 32)"
          DEMO_PASSWORD="$(openssl rand -hex 16)"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" >> "$GITHUB_ENV"
          echo "VAKTKLAR_BOOTSTRAP_KEY=$VAKTKLAR_BOOTSTRAP_KEY" >> "$GITHUB_ENV"
          echo "DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET_KEY"
          echo "::add-mask::$VAKTKLAR_BOOTSTRAP_KEY"
          echo "::add-mask::$DEMO_PASSWORD"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Docker Compose stack
        run: docker compose build
      - name: Start full stack
        run: docker compose up -d
      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:5080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color --tail=200 api sqlserver
          exit 1
      - name: Check frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8088/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs --no-color --tail=100 frontend
          exit 1
      - name: Verify unauthenticated API is protected
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/api/dashboard)" = "401"
      - name: Show service status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200 api frontend sqlserver
      - name: Stop stack
        if: always()
        run: docker compose down -v
