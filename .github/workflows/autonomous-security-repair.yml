name: Autonomous Security Repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, audit, test and build all npm projects
        shell: bash
        run: |
          set -e
          found=0
          while IFS= read -r package; do
            found=1
            dir="$(dirname "$package")"
            npm install --ignore-scripts --no-audit --prefix "$dir"
            npm audit --audit-level=high --prefix "$dir"
            npm test --if-present --prefix "$dir"
            npm run build --if-present --prefix "$dir"
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -print)
          if [ "$found" -eq 0 ]; then echo "No npm projects found."; fi
