name: Reconcile EF migration snapshot

# Deliberately triggered by changes to this workflow so a model reconciliation can
# be performed in GitHub Actions without requiring a local EF command.
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/reconcile-ef-migration.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore backend
        run: dotnet restore backend/Workforce.Api/Workforce.Api.csproj
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.11
      - name: Generate reconciliation migration
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add ReconcileModel --project backend/Workforce.Api/Workforce.Api.csproj --startup-project backend/Workforce.Api/Workforce.Api.csproj --context Workforce.Api.Data.AppDbContext --output-dir Migrations
      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration files were generated; the model is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Workforce.Api/Migrations
          git commit -m "fix: reconcile EF model snapshot"
          git push origin HEAD:main
