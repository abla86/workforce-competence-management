name: SQL Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Str0ng_Test_Passw0rd!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Str0ng_Test_Passw0rd! -C -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install sqlfluff==4.3.0
      - name: Parse T-SQL
        run: |
          for f in setup.sql sql/*.sql; do
            echo "Parsing $f"
            sqlfluff parse --dialect tsql "$f" >/dev/null
          done