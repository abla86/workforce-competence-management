services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "VaktklarLocalDb_2026_StrongPassword_9X7K4M2P8Q6R5T3Y1"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend/Workforce.Api
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      DEMO_MODE: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=WorkforceCompetenceDb;User Id=sa;Password=VaktklarLocalDb_2026_StrongPassword_9X7K4M2P8Q6R5T3Y1;TrustServerCertificate=True"
      Jwt__SecretKey: "VaktklarLocalJwtSecret_2026_AtLeast32Bytes_9X7K4M2P8Q6R5T3Y1"
      Jwt__Issuer: "vaktklar"
      Jwt__Audience: "vaktklar-web"
      VAKTKLAR_BOOTSTRAP_KEY: "VaktklarLocalBootstrap_2026_DemoKey_9X7K4M2P8Q6R5T3Y1"
      Security__CookieSecure: "false"
      Cors__Origins__0: "http://localhost:8088"
      Cors__Origins__1: "http://localhost:5173"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_DEMO_AUTO_LOGIN: "true"
      VITE_DEMO_USERNAME: "demo"
      VITE_DEMO_PASSWORD: "VaktklarDemo2026!"
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sql_data:
