name: .NET CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore ShiftPlanner.sln
      - run: dotnet build ShiftPlanner.sln --configuration Release --no-restore
      - run: dotnet test ShiftPlanner.sln --configuration Release --no-build